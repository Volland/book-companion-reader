<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Book Companion Reader logo: a little cat reading on a pile of books">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- sparkles -->
  <path d="M206 38 C208 50 211 53 223 55 C211 57 208 60 206 72 C204 60 201 57 189 55 C201 53 204 50 206 38 Z" fill="#fde68a"/>
  <path d="M52 56 C53 62 55 64 61 65 C55 66 53 68 52 74 C51 68 49 66 43 65 C49 64 51 62 52 56 Z" fill="#fde68a" opacity=".8"/>

  <!-- tail -->
  <path d="M158 150 C198 152 210 120 192 100" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
  <path d="M158 150 C198 152 210 120 192 100" fill="none" stroke="#c2410c" stroke-width="12" stroke-linecap="round" stroke-dasharray="5 11" opacity=".55"/>

  <!-- cat body -->
  <ellipse cx="128" cy="126" rx="38" ry="30" fill="url(#fur)"/>
  <!-- ears -->
  <path d="M103 68 L103 40 L127 56 Z" fill="#f97316" stroke="#f97316" stroke-width="6" stroke-linejoin="round"/>
  <path d="M153 68 L153 40 L129 56 Z" fill="#f97316" stroke="#f97316" stroke-width="6" stroke-linejoin="round"/>
  <path d="M108 60 L108 49 L118 56 Z" fill="#fda4af"/>
  <path d="M148 60 L148 49 L138 56 Z" fill="#fda4af"/>
  <!-- head -->
  <circle cx="128" cy="80" r="28" fill="url(#fur)"/>
  <!-- forehead stripes -->
  <g stroke="#c2410c" stroke-width="4" stroke-linecap="round" opacity=".7">
    <line x1="128" y1="54" x2="128" y2="62"/>
    <line x1="119" y1="56" x2="121" y2="63"/>
    <line x1="137" y1="56" x2="135" y2="63"/>
  </g>
  <!-- muzzle -->
  <ellipse cx="128" cy="93" rx="12" ry="8" fill="#ffedd5"/>
  <path d="M124.5 89 L131.5 89 L128 93 Z" fill="#fb7185"/>
  <path d="M128 93 L128 96 M128 96 q-3 3 -6 1 M128 96 q3 3 6 1" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#fff7ed" stroke-width="2" stroke-linecap="round" opacity=".9">
    <line x1="112" y1="92" x2="96" y2="89"/><line x1="112" y1="96" x2="97" y2="98"/>
    <line x1="144" y1="92" x2="160" y2="89"/><line x1="144" y1="96" x2="159" y2="98"/>
  </g>
  <!-- eyes looking down at the book -->
  <path d="M112 81 q6 6 12 0 M132 81 q6 6 12 0" fill="none" stroke="#431407" stroke-width="3.5" stroke-linecap="round"/>
  <!-- little reading glasses -->
  <g fill="#ffffff" fill-opacity=".18" stroke="#fbbf24" stroke-width="3">
    <circle cx="118" cy="82" r="10"/>
    <circle cx="138" cy="82" r="10"/>
  </g>
  <path d="M128 81 L128 81" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- open book in the paws -->
  <path d="M128 112 C114 105 98 105 86 110 L86 142 C98 137 114 138 128 146 Z" fill="url(#page)"/>
  <path d="M128 112 C142 105 158 105 170 110 L170 142 C158 137 142 138 128 146 Z" fill="url(#page)"/>
  <path d="M128 112 L128 146" stroke="#c4b5fd" stroke-width="3"/>
  <g stroke="#a78bfa" stroke-width="3" stroke-linecap="round">
    <line x1="95" y1="119" x2="118" y2="122"/><line x1="95" y1="127" x2="118" y2="130"/>
    <line x1="138" y1="122" x2="161" y2="119"/><line x1="138" y1="130" x2="161" y2="127"/>
  </g>
  <!-- paws -->
  <ellipse cx="91" cy="139" rx="10" ry="8" fill="#fb923c"/>
  <ellipse cx="165" cy="139" rx="10" ry="8" fill="#fb923c"/>

  <!-- pile of books -->
  <g>
    <!-- top book -->
    <rect x="76" y="148" width="104" height="22" rx="5" fill="#14b8a6"/>
    <rect x="84" y="159" width="92" height="8" rx="3" fill="#ccfbf1"/>
    <rect x="76" y="148" width="104" height="5" rx="2.5" fill="#fff" opacity=".18"/>
    <!-- middle book, sticks out right -->
    <rect x="62" y="170" width="124" height="24" rx="5" fill="#f43f5e"/>
    <rect x="70" y="182" width="112" height="9" rx="3" fill="#ffe4e6"/>
    <rect x="62" y="170" width="124" height="5" rx="2.5" fill="#fff" opacity=".18"/>
    <rect x="164" y="170" width="6" height="12" fill="#fde68a"/>
    <!-- bottom book, wide -->
    <rect x="46" y="194" width="148" height="26" rx="5" fill="#fbbf24"/>
    <rect x="56" y="207" width="132" height="10" rx="3" fill="#fef3c7"/>
    <rect x="46" y="194" width="148" height="5" rx="2.5" fill="#fff" opacity=".25"/>
    <rect x="68" y="194" width="5" height="13" fill="#b45309" opacity=".5"/>
    <!-- small book sticking out left of the pile -->
    <rect x="150" y="194" width="0" height="0"/>
  </g>
</svg>
